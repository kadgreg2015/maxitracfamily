workflows:
  ios-adhoc:
    name: Maxitrack Family iOS - Ad-Hoc (install direct)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: maxitrack
    environment:
      groups:
        - signing # doit contenir CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.maxitrack.family"
      flutter: stable
      xcode: latest
      cocoapods: default

    # Pas de déclenchement automatique : ce workflow se lance manuellement
    # depuis l'interface Codemagic ("Start new build" → choisir ios-adhoc)

    scripts:
      - name: Récupérer les dépendances Flutter
        script: |
          flutter packages pub get

      - name: Forcer la migration du projet Xcode (sans signature)
        script: |
          flutter build ios --release --no-codesign

      - name: Récupérer/créer les fichiers de signature (ad-hoc)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          echo "--- Identités de signature dans le keychain ---"
          IDENTITIES=$(security find-identity -v -p codesigning)
          echo "$IDENTITIES"
          echo "--- Profils de provisioning récupérés ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          if echo "$IDENTITIES" | grep -q "^ *0 valid identities found"; then
            echo "ERREUR: aucun certificat de signature valide dans le keychain après fetch-signing-files/keychain add-certificates." >&2
            exit 1
          fi

      - name: Build IPA Flutter (ad-hoc)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kadgreg2015@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Maxitrack Family iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: maxitrack
    environment:
      groups:
        - signing # doit contenir CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.maxitrack.family"
        APP_STORE_APPLE_ID: 6802748974
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Récupérer les dépendances Flutter
        script: |
          flutter packages pub get

      - name: Forcer la migration du projet Xcode (sans signature)
        script: |
          flutter build ios --release --no-codesign

      - name: Récupérer/créer les fichiers de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          echo "--- Identités de signature dans le keychain ---"
          IDENTITIES=$(security find-identity -v -p codesigning)
          echo "$IDENTITIES"
          echo "--- Profils de provisioning récupérés ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          if echo "$IDENTITIES" | grep -q "^ *0 valid identities found"; then
            echo "ERREUR: aucun certificat de signature valide dans le keychain après fetch-signing-files/keychain add-certificates." >&2
            exit 1
          fi

      - name: Build IPA Flutter (release)
        script: |
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testeurs Maxitrack"

      email:
        recipients:
          - kadgreg2015@gmail.com
        notify:
          success: true
          failure: true
