workflows:
  ios-testflight:
    name: Maxitrack Family iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: maxitrack
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: "com.maxitrack.family"
        APP_STORE_APPLE_ID: 6802748974
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Récupérer les dépendances Flutter
        script: |
          flutter packages pub get

      - name: Forcer la migration du projet Xcode (sans signature)
        script: |
          flutter build ios --release --no-codesign

      - name: Récupérer/créer les fichiers de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA Flutter (release)
        script: |
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testeurs Maxitrack"

      email:
        recipients:
          - kadgreg2015@gmail.com
        notify:
          success: true
          failure: true
