name: maxitrack_child
description: Application de suivi parental MaxiTrack
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Location & Background
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.5

  # HTTP
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Device info
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2

  # Notifications (required for foreground service)
  flutter_local_notifications: ^17.2.4

  # Utils
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
